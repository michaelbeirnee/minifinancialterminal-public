# Fly.io deployment for the Mini Financial Terminal.
#
#   fly launch --no-deploy --copy-config    # claims the app name below
#   fly volumes create mft_data --size 10 --region iad
#   fly secrets set MFT_SECRET_KEY=... MFT_SEC_USER_AGENT="..."
#   fly deploy
#
# The app name must be unique across Fly; change it here (and in the volume
# commands' --app flag) if this one is taken.
app = "mini-financial-terminal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # State lives on the mounted volume, not the container layer. These repeat the
  # Dockerfile's defaults so the paths stay visible at the deployment level.
  MFT_DATABASE_URL = "sqlite:////data/terminal.db"
  MFT_CACHE_DIR = "/data/cache"

  # Switches on the production guards in backend/main.py: the app refuses to
  # boot on the shipped placeholder secret key.
  MFT_DEBUG = "false"

  # Open sign-up on a public host means strangers can burn your Anthropic
  # credits through the Assistant. Register your own account with this set to
  # "true" for one deploy, then set it back.
  MFT_ALLOW_REGISTRATION = "false"

  # The browser calls this API from the same origin it loaded the page from, so
  # no cross-origin allowance is needed. Set a comma-separated list here only if
  # you later serve the frontend from somewhere else (GitHub Pages, a CDN).
  MFT_CORS_ORIGINS = ""

# One SQLite database plus the market-data cache (185 MB and growing locally).
# 10 GB leaves room; `fly volumes extend` grows it later without downtime.
[[mounts]]
  source = "mft_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # The signal-grading sweep in backend/thesis/scheduler.py runs every 12h in
  # process. Suspending the machine between requests would stop that clock, so
  # this app stays up rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Data commands are blocking calls out to Yahoo/SEC that occupy a worker for
    # their duration, so the ceiling is deliberately low for a single shared CPU.
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/system/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Importing the app alone costs ~240 MB (pandas, scipy, statsmodels, yfinance);
  # backtests and factor models climb well above that. 512 MB gets OOM-killed.
  memory = "1gb"
  cpus = 1
